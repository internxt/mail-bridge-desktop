name: Release bridge binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v0.0.1
        required: true
        type: string
      target_ref:
        description: Commit, branch, or SHA to build and tag
        required: true
        default: main
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    name: Check release state
    runs-on: ubuntu-latest
    outputs:
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.release_exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-amd64
            os: windows
            arch: amd64
          - runner: ubuntu-latest
            target: linux-amd64
            os: linux
            arch: amd64
          - runner: macos-14
            target: darwin-universal
            os: darwin
            arch: universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CGO builds on Windows need the Visual C++ toolchain that is installed
      # on the GitHub-hosted runner.
      - name: Set up the Windows C compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Build and archive (Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist/package
          go build -trimpath -ldflags='-s -w' -o dist/package/mail-bridge ./cmd/bridge
          test -f dist/package/mail-bridge
          tar -C dist/package -czf "dist/mail-bridge_${version}_${TARGET_OS}_${TARGET_ARCH}.tar.gz" mail-bridge

      - name: Build and archive (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist/package

          for arch in arm64 amd64; do
            case "$arch" in
              arm64) machine=arm64  ;;
              amd64) machine=x86_64 ;;
            esac
            GOARCH="$arch" \
            CGO_CFLAGS="-arch $machine" \
            CGO_LDFLAGS="-arch $machine" \
              go build -trimpath -ldflags='-s -w' -o "dist/$arch" ./cmd/bridge
          done

          lipo -create dist/arm64 dist/amd64 -output dist/package/mail-bridge
          lipo -archs dist/package/mail-bridge | grep -q x86_64
          lipo -archs dist/package/mail-bridge | grep -q arm64

          tar -C dist/package -czf "dist/mail-bridge_${version}_darwin_universal.tar.gz" mail-bridge

      - name: Build and archive (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/package/mail-bridge.exe ./cmd/bridge
          if (-not (Test-Path dist/package/mail-bridge.exe -PathType Leaf)) {
            throw "mail-bridge.exe was not produced"
          }
          Compress-Archive -Path dist/package/mail-bridge.exe -DestinationPath "dist/mail-bridge_$($version)_$($env:TARGET_OS)_$($env:TARGET_ARCH).zip" -Force

      - name: Upload ${{ matrix.target }} archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/mail-bridge_*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create Mail Bridge release draft
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' || needs.prepare.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create draft release or upload its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET_REF: ${{ inputs.target_ref || github.ref }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --draft \
              --target "$TARGET_REF" \
              --title "Mail Bridge $RELEASE_TAG" \
              --generate-notes
          fi
